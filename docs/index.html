<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07366f"><title>BouwVizier 4D — interactieve demo</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f4f7fb;color:#102f54;font:600 15px/1.5 Inter,Segoe UI,Arial,sans-serif}.loader{text-align:center;padding:28px}.mark{width:42px;height:42px;border:4px solid #d6e3f0;border-top-color:#0a478d;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}small{display:block;color:#6b8095;margin-top:6px}</style></head><body><div class="loader"><div class="mark"></div><strong>BouwVizier 4D wordt geladen…</strong><small>Interactieve 4D-demo voorbereiden</small></div><script>(async()=>{try{const names=['site00.txt','site01.txt','site02.txt'];const parts=await Promise.all(names.map(n=>fetch('assets/'+n+'?v=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Bestand ontbreekt: '+n);return r.text()})));const raw=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Deze browser ondersteunt de demo-decompressie niet. Werk Safari of Chrome bij.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){document.body.innerHTML='<div class="loader"><strong>De demo kon niet worden geladen.</strong><small>'+String(error.message||error)+'</small></div>'}})();</script></body></html>
